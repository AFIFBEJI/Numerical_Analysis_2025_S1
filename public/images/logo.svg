<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#5b0ecc"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.9"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="38"/>
    </clipPath>
  </defs>

  <!-- Ombre -->
  <ellipse cx="52" cy="94" rx="28" ry="5" fill="rgba(100,0,200,0.15)"/>

  <!-- Anneau extérieur -->
  <circle cx="50" cy="50" r="46" fill="url(#ringGrad)"/>
  <circle cx="50" cy="50" r="38" fill="white"/>

  <!-- Vague grille en bas -->
  <g clip-path="url(#circleClip)">
    <path d="M12 72 Q30 60 50 68 Q70 76 88 64 L88 90 L12 90 Z" fill="url(#waveGrad)" opacity="0.5"/>
    <!-- Lignes grille horizontales -->
    <line x1="14" y1="75" x2="86" y2="69" stroke="#c084fc" stroke-width="0.4" opacity="0.6"/>
    <line x1="14" y1="80" x2="86" y2="76" stroke="#c084fc" stroke-width="0.4" opacity="0.6"/>
    <line x1="14" y1="85" x2="86" y2="83" stroke="#c084fc" stroke-width="0.4" opacity="0.6"/>
    <!-- Lignes grille verticales -->
    <line x1="25" y1="65" x2="20" y2="90" stroke="#c084fc" stroke-width="0.4" opacity="0.6"/>
    <line x1="38" y1="62" x2="35" y2="90" stroke="#c084fc" stroke-width="0.4" opacity="0.6"/>
    <line x1="52" y1="63" x2="50" y2="90" stroke="#c084fc" stroke-width="0.4" opacity="0.6"/>
    <line x1="66" y1="64" x2="65" y2="90" stroke="#c084fc" stroke-width="0.4" opacity="0.6"/>
    <line x1="78" y1="66" x2="78" y2="90" stroke="#c084fc" stroke-width="0.4" opacity="0.6"/>
  </g>

  <!-- Axes -->
  <g clip-path="url(#circleClip)">
    <!-- Axe Y -->
    <line x1="22" y1="65" x2="22" y2="22" stroke="#6d28d9" stroke-width="1.5"/>
    <polygon points="22,19 20,24 24,24" fill="#6d28d9"/>
    <!-- Axe X -->
    <line x1="22" y1="65" x2="82" y2="65" stroke="#6d28d9" stroke-width="1.5"/>
    <polygon points="85,65 80,63 80,67" fill="#6d28d9"/>

    <!-- Courbe interpolation -->
    <path d="M22 62 C28 58 32 28 42 26 C52 24 54 38 62 42 C70 46 74 52 82 50"
          fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>

    <!-- Lignes pointillées verticales -->
    <line x1="42" y1="26" x2="42" y2="65" stroke="#a78bfa" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="62" y1="42" x2="62" y2="65" stroke="#a78bfa" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="75" y1="49" x2="75" y2="65" stroke="#a78bfa" stroke-width="0.8" stroke-dasharray="2,2"/>

    <!-- Points sur la courbe -->
    <circle cx="22" cy="62" r="2.5" fill="#7c3aed"/>
    <circle cx="42" cy="26" r="2.5" fill="#7c3aed"/>
    <circle cx="62" cy="42" r="2.5" fill="#7c3aed"/>
    <circle cx="75" cy="49" r="2.5" fill="#7c3aed"/>
  </g>

  <!-- Arc décoratif de l'anneau (reflet) -->
  <path d="M18 30 Q10 50 18 70" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" stroke-linecap="round"/>
</svg>
